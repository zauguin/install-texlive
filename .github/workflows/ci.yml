name: Continuous Integration

on:
  push:
  pull_request:
  schedule:
    - cron: '1 2 5 * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  first-run:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
    name: '1st: ${{ matrix.os }}'
    runs-on: '${{ matrix.os }}'
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Run the action
        uses: ./
        with:
          packages: latex-bin
          cache_version: ${{ github.run_id }}_${{ github.run_attempt }}
          texlive_version: '2024'
      - run: pdflatex test.tex

  run-with-cache:
    needs: first-run
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
    name: '2nd: ${{ matrix.os }}'
    runs-on: '${{ matrix.os }}'
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Run the action
        uses: ./
        with:
          packages: latex-bin
          cache_version: ${{ github.run_id }}_${{ github.run_attempt }}
          repository: https://127.0.0.42/not-a-texlive-mirror/
          texlive_version: '2024'
      - run: pdflatex test.tex
      - name: '"pdflatex test-enumitem.tex" should fail'
        run: |
          ! pdflatex -interaction=nonstopmode test-enumitem.tex
