name: Lint Codebase

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  lint:
    name: Lint Codebase
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: pnpm/setup@v3
        with:
          cache: true

      - name: Lint Codebase
        run: "pnpm run format:write && pnpm run lint"
